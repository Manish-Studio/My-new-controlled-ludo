name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Checking Java version..."
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Java version string: $JAVA_VER_STRING"
          
          JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | sed -E 's/.*version "([^"]+)".*/\1/' | awk -F'.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Failed to detect Java major version."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version $JAVA_MAJOR is lower than required version 17."
            exit 1
          fi

          echo "Java environment verified successfully: Version $JAVA_MAJOR is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Keystore already exists at $KEYSTORE_PATH. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to verify or generate debug.keystore."
            exit 1
          fi

          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK"
            echo "Searching app/build/outputs/apk directory for existing APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Generated APK file $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::$EXPECTED_APK does not have .apk extension."; exit 1 ;;
          esac

          APK_SIZE=$(stat -c%s "$EXPECTED_APK")
          echo "Verified APK at $EXPECTED_APK (Size: $APK_SIZE bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="$TMP_DIR/app-debug.apk"

          cp "$SRC_APK" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Failed to prepare release asset at $DEST_APK"
            exit 1
          fi

          echo "Prepared release asset: $DEST_APK"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Release asset file $ASSET_PATH does not exist."
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file $ASSET_PATH is empty."
            exit 1
          fi

          ASSET_FILENAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be app-debug.apk, got $ASSET_FILENAME"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}
          - APK is intended for testing.
          - APK is not a Play Store production release.
          - APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=========================================="
            echo "GitHub Release published successfully!"
            gh release view "$TAG_NAME"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Filename: app-debug.apk"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Direct APK Download URL: $DIRECT_URL"
            echo "=========================================="

            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The normal Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "If the APK build succeeded, the GitHub Actions artifact named 'app-debug-apk' remains available as a backup."
            echo "### RELEASE NOTICE" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Release creation was not completed. The Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          fi
