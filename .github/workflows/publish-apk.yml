name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Package Release Assets
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/LudoKing-debug.apk
          cd release-artifacts
          sha256sum LudoKing-debug.apk > LudoKing-debug.apk.sha256
          echo "Release artifacts prepared:"
          ls -la

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RELEASE_TAG="v1.0.${{ github.run_number }}"
          RELEASE_TITLE="Ludo King Debug Build ${{ github.run_number }}"
          APK_PATH="release-artifacts/LudoKing-debug.apk"
          SHA_PATH="release-artifacts/LudoKing-debug.apk.sha256"

          gh release create "$RELEASE_TAG" "$APK_PATH" "$SHA_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "Automated build and release of Ludo King debug APK." \
            --latest
